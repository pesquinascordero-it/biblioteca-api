<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="top">
    <div>
      <h1>Biblioteca</h1>
      <p class="subtitle">Gestión de libros a través de una API REST</p>
    </div>

    <!-- Interruptor entre la API real y los datos de prueba -->
    <label class="mode">
      <input type="checkbox" id="demo-mode">
      <span>Modo demo <small>(sin servidor)</small></span>
    </label>
  </header>

  <!-- Aviso que aparece cuando no se puede conectar con la API -->
  <div id="connection-banner" class="banner" hidden>
    <span id="connection-message"></span>
    <button type="button" id="banner-demo-btn" class="btn btn-small">Usar modo demo</button>
  </div>

  <main class="layout">

    <!-- ===== Formulario para crear / editar ===== -->
    <section class="card form-card">
      <h2 id="form-title">Añadir libro</h2>

      <form id="book-form" novalidate>
        <input type="hidden" id="book-id">

        <label>Título *
          <input type="text" id="title" maxlength="200">
        </label>

        <label>Autor *
          <input type="text" id="author" maxlength="120">
        </label>

        <div class="row">
          <label>Año *
            <input type="number" id="year" step="1">
          </label>
          <label>Género
            <input type="text" id="genre" maxlength="50" list="genre-list">
          </label>
        </div>

        <label>ISBN
          <input type="text" id="isbn" placeholder="978…">
        </label>

        <label class="check">
          <input type="checkbox" id="available" checked>
          Disponible para préstamo
        </label>

        <!-- Aquí se muestran los errores de validación que devuelve la API -->
        <div id="form-errors" class="errors" hidden></div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Guardar</button>
          <button type="button" class="btn" id="cancel-btn" hidden>Cancelar</button>
        </div>
      </form>

      <datalist id="genre-list">
        <option value="Novela"><option value="Misterio"><option value="Ciencia ficción">
        <option value="Relatos"><option value="Infantil"><option value="Programación">
      </datalist>
    </section>

    <!-- ===== Listado con filtros y paginación ===== -->
    <section class="card list-card">
      <form id="filters" class="filters">
        <input type="search" id="f-q" placeholder="Buscar por título o autor">
        <input type="text" id="f-genre" placeholder="Género" list="genre-list">
        <select id="f-available">
          <option value="">Todos</option>
          <option value="true">Disponibles</option>
          <option value="false">Prestados</option>
        </select>
        <select id="f-sort">
          <option value="title">Ordenar: título</option>
          <option value="author">Ordenar: autor</option>
          <option value="year">Ordenar: año</option>
          <option value="createdAt">Ordenar: fecha de alta</option>
        </select>
        <select id="f-order">
          <option value="asc">Ascendente</option>
          <option value="desc">Descendente</option>
        </select>
        <select id="f-limit">
          <option value="5">5 por página</option>
          <option value="10" selected>10 por página</option>
          <option value="20">20 por página</option>
        </select>
      </form>

      <div id="list-status" class="list-status"></div>

      <div class="table-wrap">
      <table class="books">
        <thead>
          <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>Año</th>
            <th>Género</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="books-body"></tbody>
      </table>
      </div>

      <nav class="pagination">
        <button type="button" class="btn btn-small" id="prev-btn">← Anterior</button>
        <span id="page-info"></span>
        <button type="button" class="btn btn-small" id="next-btn">Siguiente →</button>
      </nav>
    </section>

    <!-- ===== Registro de peticiones HTTP (para aprender) ===== -->
    <section class="card log-card">
      <div class="log-head">
        <h2>Peticiones HTTP</h2>
        <button type="button" class="btn btn-small" id="clear-log-btn">Limpiar</button>
      </div>
      <p class="hint">Cada acción de la página envía una petición a la API. Aquí ves el método, la ruta y el código de estado de la respuesta.</p>
      <ol id="request-log" class="log"></ol>
    </section>

  </main>

  <!-- Orden importante: primero la capa de API, luego la lógica de la página -->
  <script src="js/api.js"></script>
  <script src="js/demo-api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
